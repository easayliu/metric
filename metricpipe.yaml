# metricpipe 配置示例：收 OTLP 指标写入 ClickHouse。
# 启动: metricpipe metricpipe.yaml    建表: metricpipe --ddl metricpipe.yaml

source:
  # otlp = 正经部署用；stdin = 读 OTLP/JSON 行（OTel collector file exporter 的格式），调试用
  type: otlp
  # 两个监听地址都是 OTel SDK 的默认端口。写 null 或 "" 关掉其中一个
  grpc: 0.0.0.0:4317
  http: 0.0.0.0:4318
  # 单个请求（解压后）的大小上限，超过直接拒收
  max_request_bytes: 16777216
  # 下游队列满时最多等多久再回「稍后重试」（gRPC UNAVAILABLE / HTTP 503），SDK 会退避重发
  enqueue_timeout_secs: 5
  # 等数据真正写进 ClickHouse 再给 SDK 回成功：写失败 SDK 会重发，等于没有磁盘缓冲也
  # 至少一次。代价是每个导出请求多等一个攒批周期 + 一次写入。默认关
  wait_for_write: false
  # wait_for_write 时最多等落库多久，超时回「稍后重试」。要比客户端的导出超时短
  # （SDK 默认 10s），否则客户端先超时重发、这边的应答就白等了。数据仍在队列里、
  # 最终还是会写进去，客户端重发的那份就是重复行
  write_timeout_secs: 8

# sink 的字段跟着 type 走，两段二选一（注意别混着填）
sink:
  type: console
  encoding: json           # json = 和落库一致的一行 JSON；text = 一行一个数据点的摘要

# 要入库就把上面两行注掉，改用这段：
# sink:
#   type: clickhouse
#   endpoint: http://127.0.0.1:8123
#   database: logs
#   table: otel_metric
#   # ClickHouse 集群名（system.clusters 里的那个）。填了 --ddl 就生成
#   # ReplicatedMergeTree 本地表 otel_metric_local + Distributed 表 otel_metric，
#   # 两条都带 ON CLUSTER；sink 还是往 table 写，写入路径不变。单机不用填。
#   cluster: ""
#   # 时间戳列的显示时区。只影响 --ddl：timestamp / start_timestamp /
#   # exemplars.timestamp 建成 DateTime64(9, 'Asia/Shanghai')。存的时刻总是对的
#   # （INSERT 一律带偏移），配上是为了和 logpipe / tracepipe 的表查出来口径一致。
#   timezone: Asia/Shanghai
#   user: default
#   password: ""
#   # 属性列（resource_attributes / attributes）里几条已知路径的类型提示。建表时写成
#   # attributes JSON(http.route String, ...)：这些路径变成类型确定的独立子列，查询不用
#   # 写 attributes.http.route.:String，不同服务对同一个 key 发不同类型也不会
#   # NO_COMMON_TYPE。语义约定里的 key 类型是定死的，值得提示。
#   # 注意：只在 CREATE TABLE 时生效，老表上 ADD COLUMN 见列已存在会跳过 —— 要么
#   # MODIFY COLUMN（重写整列），要么重建表；配了没生效 healthcheck 会 warn。
#   attribute_types:
#     http.route: String
#     http.response.status_code: Int64
#   # 明知不想入库的 key，连子列都不建（临时调试标签、误埋的高基数 key）
#   attribute_skip: [debug.payload]
#   attribute_skip_regexp: ['^tmp\..*']
#   # 让 ClickHouse 服务端再攒一层批。这边已经按 batch 攒到上万行，一般不需要：
#   # 每批体积多半超过服务端 async_insert_max_data_size，开了只多一次拷贝和
#   # wait_for_async_insert 的等待，直接算进 wait_for_write 的应答延迟。副本很多、
#   # 每批很小时才值得
#   async_insert: false
#   # INSERT 请求体格式。json_compact_each_row（默认）只有值、列名写在 INSERT 语句里，
#   # 比 json_each_row 每行少五百多字节；后者留作退路（中间代理改写 SQL 之类）
#   insert_format: json_compact_each_row
#   timeout_secs: 30

batch:
  # 一个数据点一行，一次上报动辄几千个点，攒批可以放大一些
  max_events: 20000
  # 按体积兜底（估算值，一个带十来个标签的点约 1 KB）。放得比 max_events 对应的体积宽，
  # 正常由 max_events 说了算；设小了会让实际批远小于 max_events
  max_bytes: 33554432
  timeout_secs: 2

retry:
  max_attempts: 5
  initial_backoff_ms: 500
  max_backoff_secs: 30

pipeline:
  # source 与 sink 之间的队列，按批数
  buffer: 64
  # 队列里最多压多少个数据点。这才是内存上界（一个点连属性约 1 KB，10 万个约 100 MB，
  # 再加正在攒和正在写的各一批 max_events）；buffer 按批数限不住一次上万个点的请求。
  # 到了上限接收端等 enqueue_timeout 后回「稍后重试」
  max_queued_events: 100000
  # 每隔多少秒打一条运行统计（收发量、写入耗时、队列深度），0 关掉
  stats_interval_secs: 30
  # ClickHouse 连不上就不启动
  require_healthy: true
  # 重试耗尽后：stop = 停下（配了 wait_for_write 的话 SDK 会重发）；drop = 丢掉继续跑
  on_error: stop

# 附加到每条数据点上的静态字段（--ddl 会自动带上对应的列）
fields:
  cluster: bj-prod
  env: prod
