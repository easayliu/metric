# 集群内跑几个 metricpipe 副本，接收全集群应用上报的 OTLP 指标写进 ClickHouse。
# 和 tracepipe 一样是 push 模型：应用（或 OTel collector）主动发过来，所以是
# Deployment + Service，不是 DaemonSet；不需要读宿主机文件，也不需要 root。
---
# 和 logpipe / ClickHouse 同一个 namespace：日志、trace、指标查询时经常要互相对照，
# 分开只是多一层 DNS。已经有了的话这段 apply 是空转。
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metricpipe-config
  namespace: logging
data:
  metricpipe.yaml: |
    source:
      type: otlp
      grpc: 0.0.0.0:4317
      http: 0.0.0.0:4318
      max_request_bytes: 16777216
      # 队列满时最多等这么久再回 UNAVAILABLE。关掉 wait_for_write 之后，这是**唯一**的
      # 背压点：收得比写得快时，先把队列填满，再让 collector 退避重发
      enqueue_timeout_secs: 5
      # 关掉。入库是我们自己这条链路，没必要让 collector 挂在那儿等一次 ClickHouse 往返：
      # 收下、进队列就回 OK，单次导出从「攒批 + 写入」的秒级降到毫秒级，一个 consumer
      # 就能顶掉原来十几个，collector 的 sending_queue 不再堆积。
      # 代价是丢掉「至少一次」：已经回了 OK、还压在队列/缓冲区里的那部分，Pod 被硬杀
      # （SIGKILL / OOM / 节点宕）就没了 —— SIGTERM 正常退出会先冲刷完再走，滚动更新
      # 不丢。要换回「至少一次」就把这里改回 true，其他参数按注释一起回调
      wait_for_write: false
      # wait_for_write 关着时这项不生效，留着是为了改回去不用重查
      write_timeout_secs: 8

    sink:
      type: clickhouse
      endpoint: http://clickhouse.logging.svc.cluster.local:8123
      database: logs
      table: otel_metric
      # ClickHouse 集群名。填了就写 Distributed 表、DDL 带 ON CLUSTER；
      # 改了这里要同步改 metricpipe-ddl-job.yaml 的 CH_CLUSTER
      # cluster: bj_ck
      # 和 logpipe / tracepipe 的表配成同一个时区，几张表对照着看时间才是同一口径
      timezone: Asia/Shanghai
      user: default
      password: ""
      # 常查的标签给类型提示：建表时物化成类型确定的子列，查询不用写 .:Int64。
      # 只在建表时生效，改了要重跑 ddl Job 之外还得 MODIFY COLUMN 或重建表
      # attribute_types:
      #   http.route: String
      #   http.response.status_code: Int64
      # 明知不要的 key 直接挡掉，连子列都不建
      # attribute_skip_regexp: ['^tmp\..*']
      # 不开服务端异步攒批：这边每批已经攒到上万行、体积超过服务端
      # async_insert_max_data_size，开了只是多一次拷贝加 wait_for_async_insert 的等待，
      # 而且直接算进 wait_for_write 的应答延迟。两个副本每 2s 一批远够不上 too many parts
      async_insert: false
      timeout_secs: 30

    batch:
      # 一次上报动辄几千个数据点，攒批放大一些
      max_events: 20000
      # 关掉 wait_for_write 之后这个超时不再算进 collector 的导出延迟，可以放回去攒大批：
      # 两个副本各 5s 一批，ClickHouse 那边 part 少、后台合并压力小。
      # 改回 wait_for_write: true 的话这里要压到 1~2s，否则每个导出都要多等一个攒批周期
      timeout_secs: 5

    retry:
      # 不等落库了，客户端拿到 OK 就不会再重发 —— 队列是唯一的缓冲，ClickHouse 抖动
      # 得能多扛一会儿。0.5+1+2+4+8+16+30 ≈ 60s 之后才判死（默认 5 次只有 ~8s，
      # 一次稍长的 merge 或网络抖动就够把 pipeline 判死重启）
      max_attempts: 8
      initial_backoff_ms: 500
      max_backoff_secs: 30

    pipeline:
      # 队列里最多压 10 万个数据点（约 100~150 MB），加上正在攒 / 正在写的各 2 万个，
      # 是这个进程的内存上界，和下面的 limit 对着调。
      # 注意：wait_for_write 关了之后 collector 不再被应答节流，这个队列会真的被填到
      # 接近上限（之前是被应答往返自然限住的）。看 `pipeline 统计` 日志里的
      # queued_events：长期贴着 10 万说明写入跟不上，那时候是加副本，不是加这个数字
      max_queued_events: 100000
      require_healthy: true
      on_error: stop

    fields:
      cluster: bj-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metricpipe
  namespace: logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metricpipe
  template:
    metadata:
      labels:
        app: metricpipe
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: metricpipe
          # 打 v* tag 由 CI 推到 GHCR，见 README「发布」
          image: ghcr.io/easayliu/metric:v0.2.0
          args: ["/etc/metricpipe/metricpipe.yaml"]
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          # 起来之后端口才通；HTTP 端口对非 POST 回 405，能证明进程活着就够了
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 20
          resources:
            requests:
              # 队列填满时稳态就在 400~600Mi，128Mi 的 request 是在骗调度器，
              # 节点吃紧时会被优先驱逐
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/metricpipe
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: metricpipe-config
---
# 应用把 OTEL_EXPORTER_OTLP_ENDPOINT 指到 http://metricpipe.logging.svc.cluster.local:4317
apiVersion: v1
kind: Service
metadata:
  name: metricpipe
  namespace: logging
spec:
  selector:
    app: metricpipe
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
# 给 gRPC 做跨副本负载均衡用：headless Service（clusterIP: None）的 DNS 返回所有
# Pod IP，collector 的 otlp exporter 配 dns:///metricpipe-headless...:4317 加
# balancer_name: round_robin 才会把每个 RPC 轮着发给不同副本。
# 上面那个 ClusterIP Service 保留不动：应用直连、OTLP/HTTP 4318 还用它。
apiVersion: v1
kind: Service
metadata:
  name: metricpipe-headless
  namespace: logging
spec:
  clusterIP: None
  selector:
    app: metricpipe
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
